# pnpm configuration (pnpm 12 reads settings from this file, not package.json)
# Allow these dependencies to run postinstall/build scripts.
# esbuild/@tailwindcss/oxide/unrs-resolver fetch native binaries; playwright downloads browsers.
allowBuilds:
  esbuild: true
  playwright: true
  '@playwright/test': true
  '@tailwindcss/oxide': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@sveltejs/adapter-netlify@7.0.1'
  - '@sveltejs/kit@3.0.1'
  - svelte@5.57.2
  - vite@8.3.3
